<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> Home page </title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <header class="site-header"> 
        <img src="Images/placeholder.svg" alt="Website logo">
        <nav class="links">
        <a href="#">Home</a>
        <a href="detail.html">Featured speakers</a>
        <a href="#">Contact</a>
        </nav>
    </header>

    <main class="container">
        <section class="hero-grid">
            <article class="hero-banner">
                <h3> Primary Spotlight Banner </h3>
                <p> Main headline </p>
                <p> subtitle </p>
                <button class="hero-button"> Call to action </button>
            </article>

            <article class="hero-sidebar">
                <h3> Secondary info / quick links </h3>
                <p> Bio / contact / status </p>
                <p> Quick links list </p>
                <ul>
                    <li> Link 1 </li>
                    <li> Link 2 </li>
                    <li> Link 3 </li>
                </ul>
            </article>
        </section>

        <section class="cards-gallery">
            <article class="card">
                <h3> Event 1 </h3>
                <button class="card-button"> Details </button>
            </article>

            <article class="card">
                <h3> Event 2 </h3>
                <button class="card-button"> Details </button>
            </article>

            <article class="card">
                <h3> Event 3 </h3>
                <button class="card-button"> Details </button>
            </article>
        </section>

    </main>

    <footer class="site-footer">
        <p>© 2026 brand identity</p>
        <p> Social links / Email </p>
    </footer>

</body>
</html>
